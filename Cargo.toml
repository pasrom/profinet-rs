[package]
name = "profinet-rs"
version = "0.1.0"
edition = "2021"
authors = ["Roman Passler"]
repository = "https://github.com/pasrom/profinet-rs"
description = "PROFINET IO-controller: DCP, DCE/RPC, acyclic records, cyclic RT_CLASS_1, I&M, diagnosis and alarms (Rust port of profinet-py)"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["profinet", "fieldbus", "dcp", "industrial", "automation"]
categories = ["network-programming", "embedded"]

[[bin]]
name = "profinet"
path = "src/bin/profinet.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# "termination" so the safe-shutdown handler also runs on SIGTERM/SIGHUP
# (plain `kill`, a supervisor, `timeout`): without it those signals kill the
# process outright and would strand a held output bit.
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.4"
mac_address = "1"
pcap = "2"
roxmltree = "0.21"
# The `serve` line protocol is serialised from types, not assembled from format
# strings, so field names and shapes are checked by the compiler.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"

[dev-dependencies]
hex = "0.4"

[lints.clippy]
all = "warn"

[lints.rust]
missing_debug_implementations = "warn"
