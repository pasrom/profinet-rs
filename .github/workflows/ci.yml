name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain action: `rustup show` installs exactly what
      # rust-toolchain.toml pins, components included, so the file is the
      # single source of truth and CI cannot drift from local.
      - run: rustup show
      # libpcap is needed once the raw-L2 (dcp/rt/cyclic) modules land.
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      # libpcap ships with the OS here, so only the tests differ from `check`.
      # They run because macOS is the platform this is developed on, and a
      # Linux-only gate would let a macOS-only break through: the two differ in
      # interface naming, in what a raw socket may do, and in how the interface
      # list is read.
      - run: cargo test --all

  cargo-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      # `--locked` so the tool that judges our dependencies is not itself built
      # from a resolution nobody pinned.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  cargo-deny:
    name: cargo-deny (licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Everything except advisories, which cargo-audit above already reads from
      # the same RustSec database. What this adds is the rest: a licence the
      # GPL cannot absorb, a crate with no licence at all, a wildcard version
      # requirement, and a dependency from somewhere other than crates.io.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  build:
    name: build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target must not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: profinet
          # arm64 only: no Intel Mac is in use here, and an x86_64 slice nobody
          # runs is a build to keep working and an artefact to pick wrongly.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: profinet
          # Cross-built from Linux rather than on a Windows runner: the pcap
          # crate needs an import library for wpcap.dll, and there are two ways
          # to get one — the Npcap SDK, a download whose licence restricts
          # redistribution, or `dlltool` over a list of symbol names. The second
          # needs nothing but mingw, so this build depends on no third-party
          # download. See tools/wpcap.def.
          - name: windows-x86_64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            binary: profinet.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}

      - name: Install libpcap (linux target)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install mingw and build the wpcap import library
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          mkdir -p "$RUNNER_TEMP/wpcap"
          x86_64-w64-mingw32-dlltool -d tools/wpcap.def \
            -l "$RUNNER_TEMP/wpcap/libwpcap.a"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-gnu' && format('-L {0}/wpcap', runner.temp) || '' }}

      - name: Name the binary after its target
        run: |
          src="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -f "$src"
          ext=""
          case "${{ matrix.binary }}" in *.exe) ext=".exe" ;; esac
          # A tag names itself; anything else carries the commit it came from,
          # so a downloaded binary can always be traced back to a build.
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF#refs/tags/}" ;;
            *) version="$(git rev-parse --short HEAD)" ;;
          esac
          cp "$src" "profinet-${{ matrix.name }}-$version$ext"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profinet-${{ matrix.name }}
          path: profinet-${{ matrix.name }}-*
          retention-days: 14

  release:
    name: release
    # Only for a version tag. Artefacts expire after 14 days, which is fine for
    # "did it build" and useless for "give me the binary that runs on that
    # machine": a release is the copy that stays.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: the release is built from the artefacts and the API, and
      # nothing here reads the working tree.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Every binary is there
        run: |
          # `build` uses `fail-fast: false`, so a red target still lets the
          # others through. Count them here rather than trust that the job ran:
          # a release carrying two of three binaries is worse than none, because
          # it looks complete.
          found=$(find artifacts -type f | wc -l)
          test "$found" -eq 3 || {
            echo "expected 3 binaries, found $found:"
            find artifacts -type f
            exit 1
          }

      # Pinned to the commit behind v3.0.2, not to the tag: a tag is a movable
      # pointer in someone else's repository, and `@v3` or `@v3.0.2` runs
      # whatever it points at on the day the workflow runs. This is the one step
      # holding a token that may write to the repository, so it runs code we
      # decided on, not code we will be given.
      - name: Publish the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*
          # Belt and braces beside the count above: an empty glob would
          # otherwise publish a release with nothing attached.
          fail_on_unmatched_files: true
          generate_release_notes: true
