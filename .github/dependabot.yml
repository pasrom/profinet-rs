version: 2

updates:
  # The counterpart of pinning every action to a commit SHA. A pinned SHA never
  # moves on its own, so without this the pin is worse than a floating tag: a
  # security fix would simply never arrive. Dependabot rewrites both the SHA and
  # the version comment beside it, which is why the `@<sha> # v1.2.3` form is
  # written that way.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for all of them. Actions move rarely and the interesting
    # question is "what changed in CI this week", not one PR per action.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Monthly and grouped, deliberately. A weekly run over this many crates is a
  # stream of pull requests nobody reads, and the security question is answered
  # elsewhere: cargo-audit runs against RustSec on every PR and weekly, and
  # Dependabot's own security updates are not on this schedule — they arrive as
  # soon as an advisory lands, regardless of what is written here.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
    commit-message:
      prefix: build
