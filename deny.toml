# cargo-deny: what this project's dependency tree is allowed to contain.
#
# The point here is not the usual one. This crate is GPL-3.0-only, so a
# permissive dependency is never a problem — the problem would be a dependency
# whose terms GPLv3 cannot absorb, or one with no licence at all, and neither
# announces itself. The allow-list is derived from the tree as it stands
# (`cargo deny list`), not copied from another project, so anything new has to
# be looked at once.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # This crate itself, spelled exactly as Cargo.toml spells it: SPDX treats
    # "GPL-3.0" and "GPL-3.0-only" as different identifiers, and the short form
    # matches nothing here. cargo-deny walks the whole graph, the root included.
    "GPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
# Two versions of the same crate are normal in a Rust tree and not worth a
# failing build; they are worth seeing in the log.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io and nothing else: a git dependency would put code in the binary
# that no registry ever saw, and this one is meant to be published.
unknown-registry = "deny"
unknown-git = "deny"
